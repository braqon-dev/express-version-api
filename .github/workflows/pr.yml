name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege by default; jobs that publish declare their own permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Lint, type check, format, tests and build run in ci.yml (required check: CI Success).
  # This workflow only adds what ci.yml doesn't: package size diff and commit messages.

  # ─────────────────────────────────────────────────────────────────────────────
  # Package Size Check
  # ─────────────────────────────────────────────────────────────────────────────
  size:
    name: Package Size
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base-branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build PR version
        run: |
          npm ci
          npm run build
          PR_SIZE=$(du -sb dist/ | cut -f1)
          echo "PR_SIZE=$PR_SIZE" >> $GITHUB_ENV
          echo "📦 PR build size: $(du -sh dist/ | cut -f1)"

      - name: Build base version
        run: |
          cd base-branch
          npm ci
          npm run build 2>/dev/null || echo "Base branch build failed, skipping comparison"
          if [ -d "dist" ]; then
            BASE_SIZE=$(du -sb dist/ | cut -f1)
            echo "BASE_SIZE=$BASE_SIZE" >> $GITHUB_ENV
            echo "📦 Base build size: $(du -sh dist/ | cut -f1)"
          else
            echo "BASE_SIZE=0" >> $GITHUB_ENV
          fi

      - name: Compare sizes
        run: |
          PR=${{ env.PR_SIZE }}
          BASE=${{ env.BASE_SIZE }}

          if [ "$BASE" -gt 0 ]; then
            DIFF=$((PR - BASE))
            PERCENT=$(echo "scale=2; ($DIFF / $BASE) * 100" | bc)
            
            if [ $DIFF -gt 0 ]; then
              echo "📈 Size increased by $DIFF bytes ($PERCENT%)"
            elif [ $DIFF -lt 0 ]; then
              echo "📉 Size decreased by $((-DIFF)) bytes ($PERCENT%)"
            else
              echo "📊 Size unchanged"
            fi
          else
            echo "ℹ️ No base branch build to compare"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Conventional Commits Check
  # ─────────────────────────────────────────────────────────────────────────────
  commits:
    name: Check Commits
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "Checking commit messages for conventional commits format..."

          COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s")
          FAILED=false

          while IFS= read -r commit; do
            if [[ -z "$commit" ]]; then
              continue
            fi
            
            if ! echo "$commit" | grep -qE "^(Merge .+|Refactor .+|((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+))"; then
              echo "❌ Invalid: $commit"
              FAILED=true
            else
              echo "✅ Valid: $commit"
            fi
          done <<< "$COMMITS"

          if [ "$FAILED" = true ]; then
            echo ""
            echo "Some commits don't follow conventional commits format."
            echo "Expected: type(scope?): description"
            echo "Examples: feat: add new feature, fix(api): resolve bug"
            exit 1
          fi

          echo ""
          echo "All commits follow conventional commits format!"
